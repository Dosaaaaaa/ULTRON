[project]
name = "ultron-voice"
version = "0.1.0"
description = "ULTRON voice pipeline: VAD, wake word, STT (whisper.cpp), TTS (Kokoro), session logic."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "httpx>=0.28",
    "websockets>=14",
    "soundfile>=0.12",
    "kokoro-onnx>=0.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs downloaded models / whisper.cpp / a running backend"]
addopts = "-ra -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
