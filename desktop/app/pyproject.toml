[project]
name = "ultron-desktop"
version = "0.1.0"
description = "ULTRON Ubuntu desktop client (PySide6)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.5.4",
    "pydantic>=2.9",
    "segno>=1.6",  # the pairing QR code (pure Python)
]

[project.scripts]
ultron-desktop = "ultron_desktop.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "websockets>=14", "ruff>=0.8", "ultron-agent", "httpx>=0.28"]

[tool.uv.sources]
ultron-agent = { path = "../agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ultron_desktop"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["retired"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"ultron_desktop/theme.py" = ["E501"]
"tests/*" = ["E501", "B008", "E402"]
"scripts/*" = ["E402", "E501"]
