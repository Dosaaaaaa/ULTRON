[project]
name = "ultron-backend"
version = "0.1.0"
description = "ULTRON cognitive core: model router, personality, conversation persistence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.28",
    "websockets>=14",
    "pgvector>=0.5.1",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# data-heavy files: long literal lines read better than wrapped ones
"tests/test_bench_scoring.py" = ["E501"]
"scripts/bench_intelligence.py" = ["E501"]
"bench/scoring.py" = ["E501"]
"app/core/reasoning.py" = ["E501"]  # regex tables
"tests/test_reasoning.py" = ["E501"]
"tests/test_web.py" = ["E501"]
